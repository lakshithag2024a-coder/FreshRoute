server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# Persistent H2 Database
spring.datasource.url=jdbc:h2:file:./data/freshroutedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Smart Matching Engine Configurable Weights
freshroute.matching.urgency-weight=0.40
freshroute.matching.quantity-weight=0.35
freshroute.matching.distance-weight=0.25
freshroute.matching.max-distance-km=25.0

# Demo Data Seeding
freshroute.seed.demo-data=true

# Food Rescue Constants
freshroute.impact.kg-per-meal=0.5
freshroute.impact.co2-kg-per-food-kg=2.5
