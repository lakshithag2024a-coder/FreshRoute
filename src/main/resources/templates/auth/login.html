<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign In - FreshRoute')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, var(--forest-dark), var(--forest-primary));">
                        <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                            <i class="bi bi-arrow-repeat"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="small text-white-50 mb-0">Sign in to rescue surplus food or manage donations</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <!-- Login Error / Logout Messages -->
                        <div th:if="${param.error}" class="alert alert-danger py-2 px-3 small rounded-3 mb-3 d-flex align-items-center">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                            <span>Invalid username or password. Please try again.</span>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success py-2 px-3 small rounded-3 mb-3 d-flex align-items-center">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <span>You have been signed out successfully.</span>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold small text-muted">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" id="username" name="username" class="form-control border-start-0 ps-0" placeholder="e.g. greenleaf or hopeshelter" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label fw-semibold small text-muted mb-0">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-forest w-100 py-2 fw-bold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                            </button>
                        </form>

                        <!-- Quick Demo Credentials Selector -->
                        <div class="mt-4 pt-3 border-top">
                            <label class="form-label text-muted small fw-bold text-uppercase d-block mb-2">
                                <i class="bi bi-stars text-warning me-1"></i>One-Click Demo Accounts:
                            </label>
                            <div class="d-flex flex-column gap-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary text-start py-2 d-flex justify-content-between align-items-center"
                                        onclick="fillDemoCredentials('greenleaf', 'password123')">
                                    <span><i class="bi bi-shop me-1 text-success"></i>Green Leaf Bistro <strong>(Donor)</strong></span>
                                    <span class="badge bg-light text-dark border">Fill</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary text-start py-2 d-flex justify-content-between align-items-center"
                                        onclick="fillDemoCredentials('hopeshelter', 'password123')">
                                    <span><i class="bi bi-heart me-1 text-primary"></i>Hope Community Shelter <strong>(Recipient)</strong></span>
                                    <span class="badge bg-light text-dark border">Fill</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary text-start py-2 d-flex justify-content-between align-items-center"
                                        onclick="fillDemoCredentials('admin', 'admin123')">
                                    <span><i class="bi bi-shield-check me-1 text-info"></i>System Administrator <strong>(Admin)</strong></span>
                                    <span class="badge bg-light text-dark border">Fill</span>
                                </button>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <span class="text-muted small">Don't have an account yet? </span>
                            <a th:href="@{/register}" class="fw-bold text-decoration-none text-success">Create Free Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
