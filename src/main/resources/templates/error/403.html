<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Access Restricted - FreshRoute')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="py-5 text-center">
    <div class="container py-5">
        <div class="card border-0 shadow-sm rounded-4 p-5 max-w-600 mx-auto bg-white">
            <div class="rounded-circle bg-danger-subtle text-danger mx-auto d-flex align-items-center justify-content-center mb-3"
                 style="width: 80px; height: 80px; font-size: 2.5rem;">
                <i class="bi bi-shield-x"></i>
            </div>
            <span class="badge bg-danger-subtle text-danger px-3 py-1 rounded-pill small fw-bold mb-2">Error 403 &bull; Forbidden</span>
            <h2 class="fw-bold text-dark mb-2">Access Restricted</h2>
            <p class="text-muted mb-4">
                You do not have the required permissions or appropriate account role to access this private page. Ensure you are signed in with the correct role (DONOR, RECIPIENT, or ADMIN).
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/}" class="btn btn-forest fw-bold px-4">Return to Home</a>
                <a th:href="@{/login}" class="btn btn-outline-secondary px-4">Switch Account</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
