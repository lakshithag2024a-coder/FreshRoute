<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Server Error - FreshRoute')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="py-5 text-center">
    <div class="container py-5">
        <div class="card border-0 shadow-sm rounded-4 p-5 max-w-600 mx-auto bg-white">
            <div class="rounded-circle bg-danger-subtle text-danger mx-auto d-flex align-items-center justify-content-center mb-3"
                 style="width: 80px; height: 80px; font-size: 2.5rem;">
                <i class="bi bi-gear-wide-connected"></i>
            </div>
            <span class="badge bg-danger text-white px-3 py-1 rounded-pill small fw-bold mb-2">Error 500 &bull; System Encountered an Issue</span>
            <h2 class="fw-bold text-dark mb-2">Something Went Wrong</h2>
            <p class="text-muted mb-4">
                An unexpected error occurred while processing your request. Please return to the homepage or try again.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/}" class="btn btn-forest fw-bold px-4">Back to FreshRoute Home</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
