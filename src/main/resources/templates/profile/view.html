<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('User Profile - FreshRoute')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="py-4">
    <div class="container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-success text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Profile & Organization Settings</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
                    <div class="p-4 text-white" style="background: linear-gradient(135deg, var(--forest-dark), var(--forest-primary));">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle bg-white text-dark d-flex align-items-center justify-content-center fw-bold fs-3"
                                     style="width: 54px; height: 54px;">
                                    <span th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                                </div>
                                <div>
                                    <h4 class="fw-bold mb-0" th:text="${user.fullName}">User Full Name</h4>
                                    <small class="text-white-50" th:text="${user.organizationName != null ? user.organizationName : 'FreshRoute Account'}">Org</small>
                                </div>
                            </div>
                            <span class="badge bg-white bg-opacity-20 text-white border border-white border-opacity-25 fs-6 py-2 px-3"
                                  th:text="${user.role.displayName}">
                                Role
                            </span>
                        </div>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/profile}" th:object="${profileDto}" method="post">
                            
                            <!-- Account Details -->
                            <h6 class="fw-bold text-success border-bottom pb-2 mb-3">Account Information</h6>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-muted">Username (Permanent)</label>
                                    <input type="text" class="form-control bg-light" th:value="${user.username}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-muted">Member Since</label>
                                    <input type="text" class="form-control bg-light" th:value="${#temporals.format(user.createdAt, 'dd MMMM yyyy')}" readonly>
                                </div>
                            </div>

                            <h6 class="fw-bold text-success border-bottom pb-2 mb-3 mt-4">Profile & Organization Details</h6>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="fullName" class="form-label fw-semibold small text-muted">Representative Full Name *</label>
                                    <input type="text" th:field="*{fullName}" class="form-control" required>
                                    <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger small"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="organizationName" class="form-label fw-semibold small text-muted">Organization / Business Name</label>
                                    <input type="text" th:field="*{organizationName}" class="form-control">
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold small text-muted">Email Address *</label>
                                    <input type="email" th:field="*{email}" class="form-control" required>
                                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-semibold small text-muted">Phone Number *</label>
                                    <input type="text" th:field="*{phone}" class="form-control" required>
                                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger small"></div>
                                </div>
                            </div>

                            <h6 class="fw-bold text-success border-bottom pb-2 mb-3 mt-4">Address / Logistics Base</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label for="address" class="form-label fw-semibold small text-muted">Street Address *</label>
                                    <input type="text" th:field="*{address}" class="form-control" required>
                                </div>
                                <div class="col-md-8">
                                    <label for="city" class="form-label fw-semibold small text-muted">City *</label>
                                    <input type="text" th:field="*{city}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="zipCode" class="form-label fw-semibold small text-muted">ZIP / Postal Code</label>
                                    <input type="text" th:field="*{zipCode}" class="form-control">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end pt-3 border-top">
                                <button type="submit" class="btn btn-forest px-4 py-2 fw-bold shadow-sm">
                                    <i class="bi bi-check-circle me-1"></i>Save Profile Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
